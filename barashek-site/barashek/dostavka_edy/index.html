<script>
    /* меню сайта ====================================================== */
    function openMenu() {
        var menuPage = document.querySelector(".menu_page");
        var menu = document.querySelector(".menu");
        window.body = document.body;
        var status = false;
        var timer;
        function action() {
            if (!status) {
                clearTimeout(timer);
                addClass(body, "menu_opened");
                status = true;
                timer = setTimeout(function() {
                    menuPage.style.overflowY = "auto";
                }, 600);
            } else {
                clearTimeout(timer);
                removeClass(body, "menu_opened");
                status = false;
                menuPage.style.overflowY = "hidden";
            }
        }
        menu.addEventListener('click', action, false);
    }
    window.addEventListener("load", openMenu, false); /* Анимация затемненения при переходе по ссылкам ================== */
    window.addEventListener("click", function(e) {
        var a = e.target.closest ? e.target.closest("a") : null;
        if (!a) return;
        var href = a.getAttribute("href") || "";
        if (a.target === "_blank") return;
        if (/^(tel:|mailto:|javascript:|#)/i.test(href)) return;
        addClass(body, "changing_page");
    }, false);
</script>


	<main>
		<section class="delivery_foto tal">

<script>
	
	//resize картинок
	function imgResize() {
		var images = document.querySelectorAll('main img');
		for(var i = 0; i < images.length; i++){
			if(images[i].offsetWidth <= images[i].parentNode.offsetWidth) {
				images[i].style.width = '100%';
				images[i].style.height = 'auto';
			}
			else {
				images[i].style.width = 'auto';
				images[i].style.height = '100%';
			}
			if(images[i].offsetHeight <= images[i].parentNode.offsetHeight) {
				images[i].style.width = 'auto';
				images[i].style.height = '100%';
			}
			else {
				images[i].style.width = '100%';
				images[i].style.height = 'auto';
			}
		}
	}
	window.addEventListener('load', imgResize, false);
	window.addEventListener('resize', imgResize, false);
</script>
